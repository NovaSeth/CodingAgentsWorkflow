# Bramki procesu CodingAgentsWorkflow w CI — to samo, co bramka zadania lokalnie.
# Wygenerowane przez setup ({{STACK}}). Akcje przypięte do SHA (checklista bezpieczeństwa §3.6); aktualizuj świadomie.
# Ochrona gałęzi main: wymagaj jednego checku „bramki / wynik” — zbiera wyniki wszystkich jobów, więc nowy job nie wymaga zmiany ochrony.
name: bramki
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bramki-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  proces:
    name: bramki / proces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: check-secrets (bez potoku; kod 2 = wynik nieważny)
        run: bash .workflow/bin/check-secrets.sh
      - name: check-secrets na commitach PR (sekret dodany i usunięty w PR też trafia do historii)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .workflow/bin/check-secrets.sh --range "origin/$BASE_REF..HEAD"
      - name: ledger bez zdublowanych ID rulingów i inicjałów
        run: node .workflow/bin/check-ledger.mjs
      - name: AGENTS.md zgodny z CLAUDE.md
        run: if [ -f AGENTS.md ] && [ -f .workflow/bin/sync-agent-rules.sh ]; then bash .workflow/bin/sync-agent-rules.sh --check; fi
  jakosc:
    name: bramki / jakosc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
{{SETUP_STEPS}}
{{GATE_STEPS}}
  wynik:
    name: bramki / wynik
    needs: [proces, jakosc]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: wszystkie joby zielone
        run: |
          echo "proces: ${{ needs.proces.result }}, jakosc: ${{ needs.jakosc.result }}"
          [ "${{ needs.proces.result }}" = success ] && [ "${{ needs.jakosc.result }}" = success ]
