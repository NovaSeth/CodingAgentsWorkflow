name: testy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  testy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 24] # najstarsza deklarowana (package.json engines) i bieżąca
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: git identity (testy tworzą repozytoria)
        run: git config --global user.email ci@example.com && git config --global user.name ci && git config --global init.defaultBranch main
      - run: npm test
      - name: check-secrets (bez potoku)
        run: bash kit/.workflow/bin/check-secrets.sh
